version: '3.8'

services:
  # API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    container_name: cpp-tracker-api
    restart: always
    environment:
      - NODE_ENV=production
      - API_PORT=3002
    volumes:
      - ./data:/app/server/data
    networks:
      - cpp-tracker-network

  # Nginx前端服务
  nginx:
    image: nginx:alpine
    container_name: cpp-tracker-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - cpp-tracker-network

networks:
  cpp-tracker-network:
    driver: bridge

volumes:
  data:
